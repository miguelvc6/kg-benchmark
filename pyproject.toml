[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-benchmark"
version = "0.2.0"
description = "Reproducible Wikidata repair benchmark for the paper experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastjsonschema>=2.21",
    "ijson>=3.2",
    "jsonschema>=4.18",
    "mwclient>=0.11",
    "openai>=2.38.0",
    "requests>=2.32",
    "tqdm>=4.66",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "numpy>=2.0",
    "pytest>=7.0",
    "ruff>=0.4.0",
]
analysis = [
    "matplotlib>=3.8",
    "numpy>=2.0",
    "pandas>=2.0",
    "seaborn>=0.13",
]
notebook = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
]
ui = [
    "streamlit>=1.42",
]

[project.scripts]
kg-benchmark = "kg_benchmark.cli:main"

[tool.setuptools]
package-dir = {"" = "src", "scripts" = "scripts"}
packages = [
    "guardian",
    "lib",
    "scripts",
    "kg_benchmark",
    "kg_benchmark.analysis",
    "kg_benchmark.audit",
    "kg_benchmark.dataset",
    "kg_benchmark.matrix",
    "kg_benchmark.selection",
]
py-modules = [
    "classifier",
    "artifact_lineage",
    "automated_audit_codex",
    "automated_consistency_audit",
    "fetcher",
    "non_llm_baselines",
    "reasoning_floor",
    "rescore_run",
    "temporal_audit",
]

[tool.setuptools.data-files]
"paper/prompts" = [
    "paper/prompts/README.md",
    "paper/prompts/abox-repair.txt",
    "paper/prompts/tbox-taxonomy-patch.txt",
    "paper/prompts/track-diagnosis.txt",
]
"schemas" = ["schemas/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--capture=sys"
