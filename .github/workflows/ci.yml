name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --extra dev
      - name: Tests
        run: uv run python -m pytest -q
      - name: Documentation portability and links
        run: uv run python -m pytest -q tests/test_documentation.py
      - name: Lint
        run: uv run ruff check src scripts tests
      - name: Sample workflow
        run: |
          uv run python -m classifier --sample --no-progress --no-full-output
          uv run python -m splitter --sample
          uv run python -m artifact_release verify \
            --manifest release/sample-v0.1.0/release_manifest.json \
            --release-root release/sample-v0.1.0
