name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --extra dev
      - name: Tests
        run: uv run python -m pytest -q
      - name: Critical lint checks
        run: uv run ruff check src scripts tests --select E9,F63,F7,F82
      - name: Sample workflow
        run: |
          uv run python -m classifier --sample --no-progress --no-full-output
          uv run python -m splitter --sample
